<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Agenda Sincronizada</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-paper: rgba(245, 239, 230, 0.96);
      --card-citas: #E8D8CE;
      --card-entregas: #E5DAC8;
      --card-tareas: #F3E9D2;
      --card-gala: #E6E2DD;
      --card-habitos: #DDE5DA;
      --highlight-day: #8C7A6B;
      --text-main: #3D3332;
      --accent-title: #4A3E3D;
      --font-main: 'Nunito', sans-serif;
      --font-title: 'Cormorant Garamond', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); }

    body {
      background-color: #E5DAC8;
      color: var(--text-main);
      padding: 15px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .agenda-paper {
      background-color: var(--bg-paper);
      width: 100%;
      max-width: 1100px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.15);
      border: 1px solid #D1C5B4;
      border-left: 12px solid #8C7A6B;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px dashed #C2B4A3;
      padding-bottom: 15px;
    }

    header h1 {
      font-family: var(--font-title);
      font-size: 3rem;
      color: var(--accent-title);
    }

    .fecha-destacada {
      font-size: 1.1rem;
      font-weight: 600;
      color: #6E5F54;
      margin-top: 5px;
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
      background: rgba(229, 218, 200, 0.4);
      padding: 12px 18px;
      border-radius: 12px;
    }

    .btn-nav {
      padding: 6px 14px;
      border: 1px solid #C2B4A3;
      background: #FFF;
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-today { background-color: #8C7A6B; color: #FFF; border: none; }

    .diario-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    @media (min-width: 768px) {
      .diario-grid { grid-template-columns: 1fr 1fr; }
    }

    .block { padding: 20px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.04); }
    .block h2 { font-family: var(--font-title); font-size: 2rem; margin-bottom: 12px; color: var(--accent-title); }
    .citas-block { background-color: var(--card-citas); }
    .entregas-block { background-color: var(--card-entregas); }
    .tareas-block { background-color: var(--card-tareas); }

    input[type="text"], input[type="time"], input[type="date"], select {
      width: 100%; padding: 7px 10px; border: 1px solid #D9CBBA; border-radius: 8px; margin-bottom: 6px;
    }

    button.btn-add {
      padding: 6px 12px; border: 1px solid #C2B4A3; background-color: #FFFFFF;
      color: var(--text-main); border-radius: 8px; cursor: pointer; font-weight: 600;
    }

    .list-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.85rem; }
    .list-table td { padding: 5px 2px; }
    .completed { text-decoration: line-through; opacity: 0.6; }
    .btn-del { background: none; border: none; color: #A84242; cursor: pointer; font-weight: bold; }

    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content {
      background: #F5EFE6; padding: 25px; border-radius: 16px;
      max-width: 550px; width: 90%; border: 2px solid #D1C5B4;
    }

    .ajustes-box { background: #FFF; border: 1px solid #D9CBBA; border-radius: 12px; padding: 15px; margin-top: 15px; }
    .ajustes-box h3 { font-family: var(--font-title); font-size: 1.4rem; margin-bottom: 6px; color: var(--accent-title); }
    .device-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #E5DAC8; }
  </style>
</head>
<body>

  <main class="agenda-paper">
    <header>
      <h1>Agenda Personal</h1>
      <div id="fecha-texto" class="fecha-destacada"></div>
    </header>

    <div class="header-controls">
      <div>
        <button class="btn-nav btn-today" onclick="irAHoy()">📍 Hoy</button>
        <input type="date" id="selector-fecha" onchange="cambiarFecha(this.value)" style="margin-left:5px; margin-bottom:0; width:auto;">
      </div>
      <div>
        <button class="btn-nav" onclick="abrirAjustes()">⚙️ Ajustes y Sincronización</button>
      </div>
    </div>

    <div class="diario-grid">
      <section class="block citas-block">
        <h2>📌 Citas del Día</h2>
        <div style="display: flex; gap: 5px;">
          <input type="time" id="cita-hora" style="width: 40%;">
          <input type="text" id="cita-texto" placeholder="Detalle...">
        </div>
        <button class="btn-add" onclick="agregarCita()">Añadir Cita</button>
        <table class="list-table"><tbody id="tabla-citas"></tbody></table>
      </section>

      <section class="block tareas-block">
        <h2>✏️ Tareas Diarias</h2>
        <input type="text" id="tarea-texto" placeholder="Nueva tarea...">
        <button class="btn-add" onclick="agregarTarea()">Añadir Tarea</button>
        <table class="list-table"><tbody id="tabla-tareas"></tbody></table>
      </section>
    </div>
  </main>

  <!-- MODAL DE AJUSTES -->
  <div id="modal-ajustes" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="font-family: var(--font-title); font-size: 2rem;">Configuración</h2>
        <button class="btn-nav" onclick="cerrarAjustes()">✕ Cerrar</button>
      </div>

      <div class="ajustes-box">
        <h3>📱 Nombre de este Dispositivo</h3>
        <div style="display:flex; gap: 8px; margin-top: 5px;">
          <input type="text" id="input-nombre-dispositivo" placeholder="Ej. Mi Portátil, Móvil...">
          <button class="btn-nav btn-today" onclick="guardarNombreDispositivo()">Guardar</button>
        </div>
      </div>

      <div class="ajustes-box">
        <h3>🔄 Sincronización</h3>
        <button class="btn-nav btn-today" onclick="sincronizarManual()" style="margin-bottom:10px;">Sincronizar Ahora</button>
        <br>
        <label style="font-size:0.85rem; font-weight:bold;">Sincronización Automática:</label>
        <select id="select-frecuencia" onchange="cambiarFrecuenciaSincronizacion(this.value)">
          <option value="0">Desactivada</option>
          <option value="1">Cada 1 minuto</option>
          <option value="5">Cada 5 minutos</option>
        </select>
        <span id="status-sincro" style="font-size: 0.8rem; display:block; margin-top:5px; color:#6E5F54;"></span>
      </div>

      <div class="ajustes-box">
        <h3>💻 Dispositivos Conectados</h3>
        <div id="lista-dispositivos">Cargando...</div>
      </div>
    </div>
  </div>

  <script>
    // Dirección IP local de tu ordenador
    const API_URL = 'http://192.168.0.45:3000/api';

    function formatearFechaLocal(date) {
      const año = date.getFullYear();
      const mes = String(date.getMonth() + 1).padStart(2, '0');
      const dia = String(date.getDate()).padStart(2, '0');
      return `${año}-${mes}-${dia}`;
    }

    let fechaActual = formatearFechaLocal(new Date());
    let datosAgenda = { citas: [], tareas: [] };
    let intervaloSincro = null;

    function obtenerDeviceId() {
      let id = localStorage.getItem('agenda_device_id');
      if (!id) {
        id = 'dev_' + Math.random().toString(36).substring(2, 9);
        localStorage.setItem('agenda_device_id', id);
      }
      return id;
    }

    function irAHoy() {
      fechaActual = formatearFechaLocal(new Date());
      cambiarFecha(fechaActual);
    }

    function cambiarFecha(nuevaFecha) {
      fechaActual = nuevaFecha;
      document.getElementById('selector-fecha').value = fechaActual;
      actualizarTextoFecha();
      cargarTodo();
    }

    function actualizarTextoFecha() {
      const opciones = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const fechaObj = new Date(fechaActual + 'T00:00:00');
      document.getElementById('fecha-texto').textContent = fechaObj.toLocaleDateString('es-ES', opciones);
    }

    function cargarDatosFecha(fStr) {
      const guardado = localStorage.getItem('agenda_datos_' + fStr);
      return guardado ? JSON.parse(guardado) : { citas: [], tareas: [] };
    }

    function guardarTodo() {
      localStorage.setItem('agenda_datos_' + fechaActual, JSON.stringify(datosAgenda));
    }

    function cargarTodo() {
      datosAgenda = cargarDatosFecha(fechaActual);
      renderCitas();
      renderTareas();
    }

    function agregarCita() {
      const hora = document.getElementById('cita-hora').value;
      const texto = document.getElementById('cita-texto').value.trim();
      if (!texto) return;
      datosAgenda.citas.push({ hora, texto });
      document.getElementById('cita-hora').value = '';
      document.getElementById('cita-texto').value = '';
      guardarTodo();
      renderCitas();
    }

    function eliminarCita(index) { datosAgenda.citas.splice(index, 1); guardarTodo(); renderCitas(); }

    function renderCitas() {
      const tbody = document.getElementById('tabla-citas');
      tbody.innerHTML = '';
      datosAgenda.citas.forEach((cita, index) => {
        tbody.innerHTML += `<tr><td style="width:25%; font-weight:bold;">${cita.hora || '--:--'}</td><td>${cita.texto}</td><td style="text-align:right;"><button class="btn-del" onclick="eliminarCita(${index})">✕</button></td></tr>`;
      });
    }

    function agregarTarea() {
      const texto = document.getElementById('tarea-texto').value.trim();
      if (!texto) return;
      datosAgenda.tareas.push({ texto, done: false });
      document.getElementById('tarea-texto').value = '';
      guardarTodo();
      renderTareas();
    }

    function toggleTarea(index) { datosAgenda.tareas[index].done = !datosAgenda.tareas[index].done; guardarTodo(); renderTareas(); }
    function eliminarTarea(index) { datosAgenda.tareas.splice(index, 1); guardarTodo(); renderTareas(); }

    function renderTareas() {
      const tbody = document.getElementById('tabla-tareas');
      tbody.innerHTML = '';
      datosAgenda.tareas.forEach((tarea, index) => {
        tbody.innerHTML += `<tr><td><input type="checkbox" ${tarea.done ? 'checked' : ''} onchange="toggleTarea(${index})"></td><td class="${tarea.done ? 'completed' : ''}">${tarea.texto}</td><td style="text-align:right;"><button class="btn-del" onclick="eliminarTarea(${index})">✕</button></td></tr>`;
      });
    }

    /* CONEXIÓN CON SERVIDOR Y DISPOSITIVOS */

    async function registrarDispositivo(nombreCustom) {
      const idDispositivo = obtenerDeviceId();
      const nombre = nombreCustom || localStorage.getItem('agenda_device_name') || 'Navegador Web';

      try {
        await fetch(`${API_URL}/dispositivos/registrar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ idDispositivo, nombre })
        });
        localStorage.setItem('agenda_device_name', nombre);
      } catch (e) {
        console.warn('Servidor local no detectado.');
      }
    }

    async function guardarNombreDispositivo() {
      const nuevoNombre = document.getElementById('input-nombre-dispositivo').value.trim();
      if (!nuevoNombre) return;
      await registrarDispositivo(nuevoNombre);
      alert('Nombre guardado');
      cargarListaDispositivos();
    }

    async function cargarListaDispositivos() {
      const contenedor = document.getElementById('lista-dispositivos');
      const miDeviceId = obtenerDeviceId();

      try {
        const res = await fetch(`${API_URL}/dispositivos`);
        const dispositivos = await res.json();

        contenedor.innerHTML = '';
        dispositivos.forEach(d => {
          const esEste = (d.id === miDeviceId);
          contenedor.innerHTML += `
            <div class="device-item">
              <div><strong>${d.nombre}</strong> ${esEste ? '(Este)' : ''}</div>
              <button class="btn-del" onclick="desconectarDispositivo('${d.id}')">Desconectar</button>
            </div>
          `;
        });
      } catch (e) {
        contenedor.innerHTML = '<i>No se pudo conectar al servidor local.</i>';
      }
    }

    async function desconectarDispositivo(id) {
      if (!confirm('¿Desconectar este dispositivo?')) return;
      try {
        await fetch(`${API_URL}/dispositivos/${id}`, { method: 'DELETE' });
        cargarListaDispositivos();
      } catch (e) {
        alert('Error al desconectar.');
      }
    }

    async function sincronizarManual() {
      const idDispositivo = obtenerDeviceId();
      const statusSpan = document.getElementById('status-sincro');
      statusSpan.textContent = 'Sincronizando...';

      try {
        const datosLocales = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith('agenda_')) datosLocales[key] = localStorage.getItem(key);
        }

        const resSubida = await fetch(`${API_URL}/sincronizar/${idDispositivo}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datosLocales)
        });

        if (!resSubida.ok) throw new Error('Dispositivo no autorizado');

        const resBajada = await fetch(`${API_URL}/sincronizar/${idDispositivo}`);
        const datosServidor = await resBajada.json();

        Object.keys(datosServidor).forEach(k => localStorage.setItem(k, datosServidor[k]));

        cargarTodo();
        statusSpan.textContent = 'Última sincro: ' + new Date().toLocaleTimeString();
      } catch (e) {
        statusSpan.textContent = 'Error: ' + e.message;
      }
    }

    function cambiarFrecuenciaSincronizacion(minutos) {
      if (intervaloSincro) clearInterval(intervaloSincro);
      const min = parseInt(minutos, 10);
      if (min > 0) intervaloSincro = setInterval(sincronizarManual, min * 60 * 1000);
    }

    function abrirAjustes() {
      document.getElementById('input-nombre-dispositivo').value = localStorage.getItem('agenda_device_name') || '';
      cargarListaDispositivos();
      document.getElementById('modal-ajustes').style.display = 'flex';
    }

    function cerrarAjustes() { document.getElementById('modal-ajustes').style.display = 'none'; }

    window.onload = async function() {
      document.getElementById('selector-fecha').value = fechaActual;
      actualizarTextoFecha();
      await registrarDispositivo();
      cargarTodo();
    };
  </script>
</body>
</html>
